[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "riff"
version = "0.2.0"
description = "YouTube Music from your terminal"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "ytmusicapi>=1.0",
    "yt-dlp>=2024.0",
    "rich>=13.0",
    "mutagen>=1.47",
    "urwid>=2.6",
    "pillow>=10.0",
    "requests>=2.28",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "shazamio>=0.7",
]

[project.scripts]
riff = "riff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riff = ["web/static/*"]
